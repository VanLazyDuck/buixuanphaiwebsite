<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Họa sĩ Bùi Xuân Phái</title>

  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f1ea;
    }

    header {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 20px;
      background: #3b2f2f;
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header-buttons {
      position: absolute;
      right: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .back-to-top,
    .like-btn {
      padding: 10px 16px;
      background: #f4f1ea;
      color: #3b2f2f;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      border: none;
      cursor: pointer;
    }

    .back-to-top:hover,
    .like-btn:hover {
      background: #e2d6c3;
    }

    .like-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .pdf-container {
      width: 100%;
      height: calc(100vh - 150px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    footer {
      text-align: center;
      padding: 18px;
      background: #3b2f2f;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body id="top">
  <header>
    <h1>Họa sĩ Bùi Xuân Phái</h1>

    <div class="header-buttons">
      <button class="like-btn" id="likeBtn" onclick="handleLike()">
        👍 Like <span id="likeCount">0</span>
      </button>

      <button class="back-to-top" onclick="goToFirstPage()">
        Back to top
      </button>    
    </div>
  </header>

  <div class="pdf-container">
    <iframe 
      id="pdfFrame"
      src="https://drive.google.com/file/d/1EzwkCHl0Z_3PhHPaWrw1Zg-ihISZir7E/preview"
      allow="autoplay">
    </iframe>
  </div>

  <footer>
    Nhóm thực hiện: Lê Vy, Phương Mai, Y Li, Trịnh Bảo Nam, Như Hiếu.
  </footer>

  <script>
    const likeBtn = document.getElementById("likeBtn");
    const likeCount = document.getElementById("likeCount");

    let count = localStorage.getItem("likeCount") || 0;
    likeCount.textContent = count;

    function handleLike() {
      const now = Date.now();
      const lastLikeTime = localStorage.getItem("lastLikeTime");
      const thirtySecs = 30 * 1000;

      if (lastLikeTime && now - lastLikeTime < thirtySecs) {
        const timeLeft = Math.ceil((thirtySecs - (now - lastLikeTime)) / 1000);
        const seconds = timeLeft % 60;

        alert(`Bạn chỉ có thể like 1 lần mỗi 30 giây. Vui lòng thử lại sau ${seconds} giây.`);
        return;
      }

      count++;
      likeCount.textContent = count;

      localStorage.setItem("likeCount", count);
      localStorage.setItem("lastLikeTime", now);
    }

    function goToFirstPage() {
      const pdfFrame = document.getElementById("pdfFrame");
      const pdfLink = "https://drive.google.com/file/d/1EzwkCHl0Z_3PhHPaWrw1Zg-ihISZir7E/preview";

      pdfFrame.src = pdfLink;
    }
  </script>
</body>
</html>
